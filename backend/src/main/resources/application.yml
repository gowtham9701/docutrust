spring:
  application:
    name: docutrust-api
  datasource:
    url: jdbc:h2:mem:docutrust;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  h2:
    console:
      enabled: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  flyway:
    enabled: true
server:
  port: ${PORT:8080}
docutrust:
  llm:
    provider: ${LLM_PROVIDER:mock}
  security:
    oidc:
      issuer-uri: ${OIDC_ISSUER_URI:}
      audiences: ${OIDC_AUDIENCES:}
management:
  endpoints:
    web:
      exposure:
        include: health,info
