services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-docutrust}
      POSTGRES_USER: ${POSTGRES_USER:-docutrust}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docutrust}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docutrust -d docutrust"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DATABASE_URL: ${DATABASE_URL:-jdbc:postgresql://postgres:5432/docutrust}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-docutrust}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-docutrust}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-google/gemma-3-27b-it:free}
      DOCUTRUST_APP_URL: ${DOCUTRUST_APP_URL:-http://localhost:3000}
      DOCUTRUST_CORS_ORIGINS: ${DOCUTRUST_CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      OIDC_ISSUER_URI: ${OIDC_ISSUER_URI:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports: ["8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy
  web:
    build: ./frontend
    restart: unless-stopped
    ports: ["3000:80"]
    depends_on: [api]
volumes:
  postgres-data:
